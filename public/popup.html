<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACEIT Check Mate</title>
  <style>
    :root {
      --primary: rgb(255, 85, 0);
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #e0e0e0;
      --text-dim: #a0a0a0;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      width: 320px;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 20px;
      background: linear-gradient(135deg, #1e1e1e 0%, #121212 100%);
      border-bottom: 1px solid #333;
      text-align: center;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 0;
      color: white;
      text-transform: uppercase;
    }

    .status-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      background: rgba(0, 255, 100, 0.1);
      color: #00ff64;
      border-radius: 20px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      border: 1px solid rgba(0, 255, 100, 0.2);
    }

    .content {
      padding: 20px;
    }

    .description {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-dim);
      margin-bottom: 20px;
      text-align: center;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid #333;
      background: var(--card-bg);
      color: white;
    }

    .btn:hover {
      background: #2a2a2a;
      border-color: #444;
      transform: translateY(-1px);
    }

    .btn-primary {
      background: var(--primary);
      border: none;
    }

    .btn-primary:hover {
      background: rgb(255, 110, 30);
    }

    .footer {
      padding: 15px;
      text-align: center;
      font-size: 11px;
      color: #666;
      border-top: 1px solid #222;
      background: #0a0a0a;
    }

    b {
      color: var(--primary);
    }
  </style>
</head>

<body>
  <div class="header">
    <div class="logo-text">CheckMate</div>
    <div class="status-badge">Extension Active</div>
  </div>

  <div class="content">
    <p class="description">
      Tracking cheaters in your history so you don't have to.
    </p>

    <div class="actions">
      <a href="https://www.faceit.com/en/home/notifications" target="_blank" class="btn btn-primary">
        Open Notifications
      </a>
      <a href="https://github.com/AmarSmajlovic/faceit-check-mate" target="_blank" class="btn">
        View on GitHub
      </a>
    </div>
  </div>

  <div class="footer">
    Made with ❤️ by <b>picrone</b>
  </div>
</body>

</html>
