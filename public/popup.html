<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FACEIT Check Mat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      width: 300px;
      background-color: rgb(29, 29, 29);
      box-sizing: border-box;
      padding: 16px 24px;
      border-radius: 2px;
      color: rgb(167, 167, 167);
      height: "auto";
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      flex-direction: column;
      -webkit-box-align: center;
      align-items: center;
    }
  
  </style>
</head>
<body>
  <h3>FACEIT Check Mate</h3>
  <p>
    This extension enhances FACEIT notifications for banned users by adding a button to redirect you to common matches played with the banned player.
  </p>
  <p>
    For more information, visit the 
    <a href="https://chrome.google.com/webstore/detail/faceit-check-mate" target="_blank">
      extension page
    </a>.
  </p>
</body>
</html>
